# Rise of Nations: Extended Edition (SkyBox Labs, 2014).
# Facts checked on the shipping build (Steam buildid 14787288):
# riseofnations.exe is PE32 (i386), not large-address-aware, NX-compatible.
# Its renderer d3dgl.dll imports d3d11.dll and D3DCOMPILER_47.dll and
# compiles the HLSL in shaders/ (including geometry shaders) at run time.
# D3DMetal is 64-bit only and MoltenVK has no geometry shaders, so DXMT is
# the only Metal path; WineD3D (OpenGL) is the fallback.

schema = 1
id = "rise-of-nations-extended-edition"
name = "Rise of Nations: Extended Edition"

[steam]
appid = 287450

[exe]
path = "riseofnations.exe"
bitness = "x86"
api = "d3d11"
geometry_shaders = true

[graphics]
backend = "dxmt"
fallbacks = ["wined3d"]

[wine]
windows_version = "win10"

[env]
# Give the 32-bit game a 4 GiB address space on runtimes that honor it.
WINE_LARGE_ADDRESS_AWARE = "1"

[dll_overrides]
# Use the Microsoft HLSL compilers the game ships, not Wine's vkd3d-shader
# builtins (Wine 11.10+ prefers builtin d3dcompiler; CrossOver prefers native).
d3dcompiler_47 = "n,b"
d3dcompiler_46 = "n,b"

[[ini]]
file = '%APPDATA%\Microsoft Games\Rise of Nations\rise2.ini'
section = "RISE OF NATIONS"
key = "SkipIntroMovies"
value = "1"
reason = "The intro videos are WMV through DirectShow; without GStreamer WMV decoders they stall the game under Wine."

# Fullscreen is an enum: 0 windowed, 1 exclusive full screen, 2 borderless
# window, 3 borderless while starting (the game turns 1 into 3 at startup
# and back only on the intro-video path, so with SkipIntroMovies=1 it stays 3).
[[ini]]
file = '%APPDATA%\Microsoft Games\Rise of Nations\rise2.ini'
section = "RISE OF NATIONS"
key = "Fullscreen"
value = "2"
reason = "A borderless window at the desktop size. Exclusive full screen (1) switches the Mac's display mode and is unreliable under Wine; 3 is a state the game uses while it starts."

# Windowed Width/Height hold the resolution in every mode. It must be a mode
# Wine reports, or the game replaces it (with 1024x768 or an odd size). The
# main display's "looks like" size is one, and the game always uses the main
# display. The game's UI does not scale, so the native pixel size would make
# the HUD half as big.
[[ini]]
file = '%APPDATA%\Microsoft Games\Rise of Nations\rise2.ini'
section = "RISE OF NATIONS"
key = "Windowed Width"
value = "{display.width}"
reason = "The main display's width in points: a mode Wine reports, so the game keeps it, and the size the borderless window covers."

[[ini]]
file = '%APPDATA%\Microsoft Games\Rise of Nations\rise2.ini'
section = "RISE OF NATIONS"
key = "Windowed Height"
value = "{display.height}"
reason = "The main display's height in points (see Windowed Width)."

[[ini]]
file = '%APPDATA%\Microsoft Games\Rise of Nations\rise2.ini'
section = "RISE OF NATIONS"
key = "IgnoreMinimizeOnTabOut"
value = "1"
reason = "Keeps Command-Tab from minimizing the borderless window."

[compat]
status = "untested"
notes = "Needs the Steam client running in the same bottle; uncork play starts it. The profile runs the game as a borderless window at the main display's \"looks like\" size (Fullscreen=2, Windowed Width and Height from the display). Retina mode and the DPI must agree: Uncork writes 96 DPI without Retina mode and 192 with it, and uncork doctor reports a bottle where they disagree (with CrossOver's 192 DPI and Retina mode off, the game saw a half-size screen: full screen cropped and offset, and crashes in d3dgl.dll). 2026-10-08 (M5 Max, macOS 27.0.1, built-in display 1728x1117 at 120 Hz, winecx-gptk-4.7.3, DXMT 0.80), each launch in a fresh Wine session: with Retina mode on and 192 DPI, 3 of 3 direct and 3 of 3 Game Mode bundle launches, and with Retina mode off and 96 DPI, 2 of 2 launches, started without a crash and showed the whole picture in a borderless 1728x1117 window at (0,0); the main menu ran at about 113 to 118 FPS with the Metal HUD. Game Mode bundles crashed the game at startup in 3 of 5 launches on 2026-10-07 and stay experimental and off by default. Not tested yet: a 5K external display with this profile, a match, audio, videos, multiplayer lobbies (PlayFab over WinHTTP), and what the camera notch hides at the top centre during a match. Wine reports no General MIDI DLS collection, so DirectMusic music may be silent."
