# Per-PR and main-branch CI. `just ci` runs the same steps locally.
# Every compile in the `check` job uses the single `ci` Cargo profile, so one
# target directory is built and cached. Release builds happen only in
# release.yml; the Wine runtime build is runtime.yml, run by hand.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTDOCFLAGS: -D warnings
  RUST_BACKTRACE: "1"

defaults:
  run:
    # Explicit bash gives `set -eo pipefail`, so `cmd | tee` fails when cmd fails.
    shell: bash

jobs:
  check:
    name: check (macos-26)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-shared-key: check
          cache-on-failure: true
          # PR runs restore main's cache but do not upload their own.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          # Keep RUSTFLAGS empty so cache keys match local builds; -D warnings is
          # passed to clippy explicitly below and to rustdoc via RUSTDOCFLAGS.
          rustflags: ""
          build-warnings: warn

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          # The versions of the local pass; bump here and in the justfile hints together.
          tool: cargo-nextest@0.9.146,cargo-machete@0.9.2,typos-cli@1.51.1,shellcheck@0.11.0

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets --locked --profile ci -- -D warnings

      - name: nextest
        run: cargo nextest run --workspace --locked --cargo-profile ci --no-fail-fast

      - name: doctests
        run: cargo test --doc --workspace --locked --profile ci

      - name: rustdoc
        run: cargo doc --workspace --no-deps --locked --profile ci

      - name: catalog pins (offline lint)
        run: scripts/check_catalog.sh

      - name: labels.yml matches sync_labels.sh
        run: scripts/sync_labels.sh --check

      - name: shellcheck
        run: shellcheck -x scripts/*.sh runtime/*.sh

      - name: runtime/build-wine.sh (offline tests)
        run: scripts/test_build_wine.sh

      - name: unused dependencies
        run: cargo machete

      - name: spelling
        run: typos

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
