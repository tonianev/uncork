name: Feature request
description: A new capability or a change in scope
labels: ["kind:feature"]
body:
  - type: markdown
    attributes:
      value: |
        Check docs/ROADMAP.md first: planned work already has a milestone and does not need a new issue. A change to a design decision gets the `needs-design` label and a short discussion before code.
        To ask for a game to be supported, open a Game report with what you tried instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, slow or impossible today? Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Name the command, setting or file it touches.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - core (components, bottles, launch planning)
        - cli (commands and output)
        - steam (Windows Steam client)
        - pe (executable inspection)
        - runtime (Wine and graphics components, catalog, Wine build)
        - profiles (game profiles)
        - docs
        - infra (CI, releases, scripts)
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This is not already planned in docs/ROADMAP.md.
          required: true
        - label: I am willing to implement this (optional).
