name: Game report
description: How a game runs on your Mac with Uncork, good or bad
labels: ["kind:game-report"]
body:
  - type: markdown
    attributes:
      value: |
        One report per game, Mac and backend. Reports are first-hand: what you saw on your own Mac with your own copy of the game, never a result copied from ProtonDB, a forum or an AI model (see AI_CONTRIBUTIONS.md).
        A maintainer may copy the report into the game's profile as a `[[compat.reports]]` entry, crediting you.
  - type: input
    id: game
    attributes:
      label: Game
      placeholder: "Rise of Nations: Extended Edition"
    validations:
      required: true
  - type: input
    id: appid
    attributes:
      label: Steam app ID
      description: The number in the game's store URL, store.steampowered.com/app/<id>/. Leave empty if the game is not from Steam.
      placeholder: "287450"
  - type: input
    id: version
    attributes:
      label: Uncork version
      description: Output of `uncork --version`, or `git rev-parse --short HEAD` if you built from source.
      placeholder: "uncork 0.1.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Wine runtime
      description: The Wine component the bottle uses, from `uncork runtime list` or `uncork bottle info <bottle>`.
      placeholder: "wine sikarugir-11.0_1"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu > About This Mac, or `sw_vers -productVersion`.
      placeholder: "27.0.1"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Chip
      options:
        - Apple M1 family
        - Apple M2 family
        - Apple M3 family
        - Apple M4 family
        - Apple M5 or newer
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Graphics backend
      description: The backend the game actually ran on (`uncork play --dry-run` shows the plan).
      options:
        - dxmt
        - d3dmetal
        - dxvk
        - wined3d
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - broken (does not start, or is unplayable)
        - runs (starts and is playable, with notable problems)
        - playable (playable start to finish, minor issues)
        - perfect (indistinguishable from Windows)
    validations:
      required: true
  - type: textarea
    id: performance
    attributes:
      label: FPS and settings
      description: Resolution, in-game graphics settings and the frame rate you saw (`uncork play --hud` shows Apple's Metal HUD). Write n/a if the game does not start.
      placeholder: "2560x1440, all settings high, 60 fps in skirmish, 45 fps in large battles"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: What works and what does not (menus, video, audio, multiplayer, saves), workarounds, and any setting you changed from the profile.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I tested this myself, on my own Mac, with my own copy of the game.
          required: true
