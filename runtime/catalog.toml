# Uncork component catalog: the exact upstream archives `uncork runtime
# install` may download. Every entry is pinned by URL, size and SHA-256;
# Uncork refuses an archive that does not match. Changing a pin is a
# reviewed pull request (docs/RUNTIME.md, "Updating a pin"): the author
# downloads the file, computes the hash themselves, and records the license
# and where the source code lives.
#
# Uncork never mirrors these files; it fetches them from their publishers.
# D3DMetal is never listed: it is imported from the user's own copy of
# Apple's Game Porting Toolkit (`uncork runtime import-gptk`).
#
# Wine feature tags (docs/RUNTIME.md, "Runtime features"):
#   wow64              runs 32-bit Windows programs (new-style WoW64)
#   msync              honors WINEMSYNC=1 (Mach-semaphore synchronization)
#   dxmt               winemac exports the Metal view API that DXMT needs
#   d3dmetal           CrossOver-derived glue that D3DMetal needs
#   renderer-dllpath   honors WINEDLLPATH_DXMT / _DXVK / _D3DMETAL per process
#   dllpath-prepend    honors WINEDLLPATH_PREPEND per process
#   large-address-aware honors WINE_LARGE_ADDRESS_AWARE=1

