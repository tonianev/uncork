# Uncork component catalog: the exact upstream archives `uncork runtime
# install` may download. Every entry is pinned by URL, size and SHA-256;
# Uncork refuses an archive that does not match. Changing a pin is a
# reviewed pull request (docs/RUNTIME.md, "Updating a pin"): the author
# downloads the file, computes the hash themselves, and records the license
# and where the source code lives.
#
# Uncork never mirrors these files; it fetches them from their publishers.
# D3DMetal is never listed: it is imported from the user's own copy of
# Apple's Game Porting Toolkit (`uncork runtime import-gptk`).
#
# Wine feature tags (docs/RUNTIME.md, "Runtime features"):
#   wow64              runs 32-bit Windows programs (new-style WoW64)
#   msync              honors WINEMSYNC=1 (Mach-semaphore synchronization)
#   dxmt               winemac exports the Metal view API that DXMT needs
#   d3dmetal           CrossOver-derived glue that D3DMetal needs
#   renderer-dllpath   honors WINEDLLPATH_DXMT / _DXVK / _D3DMETAL per process
#   dllpath-prepend    honors WINEDLLPATH_PREPEND per process
#   large-address-aware honors WINE_LARGE_ADDRESS_AWARE=1

schema = 1

# --- Wine ------------------------------------------------------------------
# Verified 2026-10-07 on macOS 27.0.1 (M5 Max): `bin/wine --version` prints
# wine-11.17; lib/wine/x86_64-unix has winemetal.so (DXMT 0.80's bridge);
# ntdll.so honors WINEMSYNC and WINE_LARGE_ADDRESS_AWARE. The archive nests
# the tree under Libraries/Wine (normalized on install).
#
# Considered and not listed: Gcenx's Sikarugir engines
# (github.com/Sikarugir-App/Engines) honor per-renderer WINEDLLPATH_* but
# need FreeType, GnuTLS and MoltenVK from the Sikarugir wrapper app, which
# Uncork does not supply (docs/RUNTIME.md).

[[component]]
kind = "wine"
version = "winecx-gptk-4.7.3"
url = "https://github.com/dappermint/winecx-gptk/releases/download/runtime-v4.7.3/Libraries.tar.gz"
sha256 = "a4b5d63493f80698cce5cad8e7212d9a51c8292037b00c478f4652636fcfd331"
size = 461131598
archive = "tar.gz"
license = "LGPL-2.1-or-later"
source_code = "https://github.com/dappermint/winecx"
homepage = "https://github.com/dappermint/winecx-gptk"
features = ["wow64", "msync", "dxmt", "d3dmetal", "large-address-aware"]
recommended = true
notes = "Wine 11.17 with CrossOver 26.3's macOS changes and msync; self-contained (FreeType, GnuTLS, MoltenVK 1.4.2, GStreamer, DXMT 0.80 bridge)."

